<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play — Pathwoven</title>
    <link rel="stylesheet" href="./css/site.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="./index.html">
          <span class="eyebrow">Interactive Stories</span>
          <span id="brand-name" class="brand-name">Pathwoven</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="./index.html">Library</a>
        </nav>
      </header>

      <header class="top play-top">
        <h1 id="story-title">Loading…</h1>
        <p id="story-meta" class="meta"></p>
        <p id="content-notes" class="notes" hidden></p>
      </header>

      <div id="resume-banner" class="resume-banner" hidden>
        <span>Saved progress found in this browser.</span>
        <button type="button" id="btn-new-game" class="secondary compact">
          Start Over
        </button>
      </div>

      <main class="layout">
        <section class="scene card" aria-live="polite">
          <h2 id="scene-title"></h2>
          <p id="scene-body" class="body"></p>
          <div id="choices" class="choices"></div>

          <div id="ending-panel" class="ending" hidden>
            <p id="ending-key" class="ending-key"></p>
            <div class="ending-actions">
              <button type="button" id="btn-toggle-storyline" class="secondary">
                Show Storyline
              </button>
              <button type="button" id="btn-restart" class="primary">
                Play Again
              </button>
              <a class="secondary link-btn" href="./index.html">Back to Library</a>
            </div>
            <pre id="storyline" class="storyline" hidden></pre>
          </div>
        </section>

        <aside class="sidebar card">
          <h3>Stats</h3>
          <ul id="stats" class="stats"></ul>
          <p class="hint">Progress saves in this browser.</p>
          <a class="text-link" href="./index.html">← Library</a>
        </aside>
      </main>

      <p id="error" class="error" hidden></p>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
